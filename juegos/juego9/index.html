<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruce Sostenible - Ciudades ODS 11</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>
    <div id="game-container">
        <!-- UI Layer -->
        <div id="ui-layer">
            <div class="stat-group">
                <div class="stat-box">
                    <span class="label">PUNTOS</span>
                    <span id="score">0</span>
                </div>
                <div class="stat-box">
                    <span class="label">VIDAS</span>
                    <div id="lives-container">
                        <span class="life">❤️</span>
                        <span class="life">❤️</span>
                        <span class="life">❤️</span>
                    </div>
                </div>
            </div>

            <div id="round-info">
                <div class="round-badge">RONDA <span id="round-number">1</span></div>
                <div id="target-info">OBJETIVO: <span id="target-score">5</span></div>
            </div>

            <div class="stat-box timer-box">
                <span class="label">TIEMPO</span>
                <span id="timer">15</span>s
            </div>
        </div>

        <!-- Game World -->
        <div id="game-canvas">
            <!-- Sidewalks -->
            <div class="sidewalk horizontal"></div>
            <div class="sidewalk vertical"></div>

            <!-- Decorations -->
            <div class="decoration eco-station" style="top: 40px; left: 40px;">
                <div class="station-roof">ECO CHARGE</div>
                <div class="station-bay"></div>
                <div class="station-bay"></div>
            </div>

            <div class="decoration sustainable-building" style="bottom: 40px; left: 40px;">
                <div class="building-block"></div>
                <div class="building-details"></div>
                <div class="roof-garden"></div>
            </div>

            <div class="decoration urban-park" style="top: 40px; right: 40px;">
                <div class="park-grass"></div>
                <div class="fountain"></div>
                <div class="tree t1"></div>
                <div class="tree t2"></div>
            </div>

            <div class="decoration solar-array" style="bottom: 40px; right: 40px;">
                <div class="panel-row">
                    <div class="pv-panel"></div>
                    <div class="pv-panel"></div>
                </div>
                <div class="panel-row">
                    <div class="pv-panel"></div>
                    <div class="pv-panel"></div>
                </div>
            </div>

            <div id="road-system">
                <div class="road horizontal"></div>
                <div class="road vertical"></div>
                <div class="intersection"></div>
            </div>

            <!-- Traffic Lights -->
            <div id="light-h" class="traffic-light horizontal green" title="Semáforo Horizontal">
                <div class="lamp red"></div>
                <div class="lamp green"></div>
            </div>
            <div id="light-v" class="traffic-light vertical red" title="Semáforo Vertical">
                <div class="lamp red"></div>
                <div class="lamp green"></div>
            </div>

            <div id="interaction-hint">ESPACIO o CLIC para cambiar</div>
        </div>

        <!-- Overlays -->
        <div id="overlay" class="hidden">
            <div id="message-box">
                <h1 id="overlay-title">MODO TRÁFICO</h1>
                <p id="overlay-text">Gestiona el cruce. No permitas que los coches choquen. Consigue que pasen
                    suficientes coches para avanzar.</p>
                <button id="action-button">Empezar Misión</button>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
